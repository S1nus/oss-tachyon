[workspace]
members = ["crates/oss-core", "crates/oss"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

# Copied from zcash-devtool's crates/tachyon-wallet/Cargo.toml. A different
# tachyon or ragu rev is a different PCD application: proofs would not verify.
[workspace.dependencies]
anyhow = "1"
hex = "0.4"
pasta_curves = { package = "zakura-pasta-curves", version = "1.0.1" }
rand = { version = "0.10", features = ["std_rng"] }
udon = { package = "zakura-udon", version = "0.1.0", features = ["traits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zcash_tachyon = { git = "https://github.com/cnode-agent/tachyon", rev = "088f4e1df789fc507742a9a08d27a07604c6a247" }
ragu = { git = "https://github.com/tachyon-zcash/ragu", rev = "839cf50d1ff31c1d8b89c1f90f808f76422cec17", features = ["mock"] }
ragu_circuits = { git = "https://github.com/tachyon-zcash/ragu", rev = "839cf50d1ff31c1d8b89c1f90f808f76422cec17" }
ragu_core = { git = "https://github.com/tachyon-zcash/ragu", rev = "839cf50d1ff31c1d8b89c1f90f808f76422cec17", package = "ragu_core", default-features = false }
# Not in devtool: needed only to name `Allocator` when oss-core frames the
# AnchorSpan and ArbitraryUnspent headers that tachyon gives no wire decoder.
ragu_primitives = { git = "https://github.com/tachyon-zcash/ragu", rev = "839cf50d1ff31c1d8b89c1f90f808f76422cec17", package = "ragu_primitives", default-features = false }

# Proof steps and field arithmetic live in dependencies; unoptimized they make
# debug tests ~15x slower. Our own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 3
